name: Sync Fork Main (Weekly)

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fork-main:
    if: github.event.repository.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main branch from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "${{ github.repository }}" -b main
